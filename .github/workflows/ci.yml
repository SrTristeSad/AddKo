name: AddKo Lua foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addko-lua-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Fetch verified Lua 5.5.1
        run: python3 tools/fetch_lua.py
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Fetch pinned Luelement addon for compatibility test
        uses: actions/checkout@v4
        with:
          repository: SrTristeSad/Luelement
          ref: 2cc1381d384eefefeab4f6ec7416cf2b3dc71935
          path: .ci/luelement
          persist-credentials: false
      - name: Compile sandbox Lua runtime for Linux integration
        run: |
          mkdir -p build/test_native
          python3 tools/build_test_lua.py build/test_native/libaddko_lua.so
      - name: Test AddKo against real Luelement Lua
        run: flutter test test/luelement_host_compatibility_test.dart --dart-define=LUELEMENT_PATH=.ci/luelement --dart-define=LUA_TEST_LIBRARY=build/test_native/libaddko_lua.so
      - name: Build Android ARM64
        run: flutter build apk --release --target-platform android-arm64 --no-pub
      - name: Verify native engine inside APK
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          expected = {
              'lib/arm64-v8a/libelementum.so': 28719993,
              'lib/arm64-v8a/libc++_shared.so': 5973872,
          }
          with ZipFile(apk) as contents:
              names = set(contents.namelist())
              for library, size in expected.items():
                  if library not in names:
                      raise SystemExit(f'Native engine missing in APK: {library}')
                  actual = contents.getinfo(library).file_size
                  if actual != size:
                      raise SystemExit(f'Incorrect {library}: {actual} != {size}')
                  print(f'Embedded {library}: {actual} bytes')
              if 'lib/arm64-v8a/libaddko_engine_bridge.so' not in names:
                  raise SystemExit('Native engine JNI bridge missing from APK')
              print('Native engine + JNI packaging verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AddKo-Lua-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
