name: AddKo Lua foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addko-lua-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Fetch verified Lua 5.5.1
        run: python3 tools/fetch_lua.py
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build Android ARM64
        run: flutter build apk --release --target-platform android-arm64 --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: AddKo-Lua-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
