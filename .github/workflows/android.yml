name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: .cache/addko-python
          key: addko-cpython-android-3.14.8-v1
      - run: flutter pub get
      - name: Stage official CPython Android runtime
        run: python3 tools/android/fetch_python_runtime.py --output android/app/build/addko-python-runtime
      - name: Build split debug APKs with embedded Python
        env:
          PYTHON: python3
        run: flutter build apk --debug --split-per-abi
      - name: Verify CPython is inside each APK
        shell: bash
        run: |
          set -euo pipefail
          ARM64=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          X64=build/app/outputs/flutter-apk/app-x86_64-debug.apk

          unzip -l "$ARM64" > apk-arm64-contents.txt
          grep -q 'lib/arm64-v8a/libpython3.14.so' apk-arm64-contents.txt
          grep -q 'assets/addko_python/3.14.8/arm64-v8a/prefix/lib/python3.14/json/__init__.py' apk-arm64-contents.txt

          unzip -l "$X64" > apk-x64-contents.txt
          grep -q 'lib/x86_64/libpython3.14.so' apk-x64-contents.txt
          grep -q 'assets/addko_python/3.14.8/x86_64/prefix/lib/python3.14/json/__init__.py' apk-x64-contents.txt

          echo 'CPython Android runtime verified in split APKs.'
      - uses: actions/upload-artifact@v4
        with:
          name: AddKo-debug-android-split
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 7
