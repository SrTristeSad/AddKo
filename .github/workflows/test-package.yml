name: Validate and package AddKo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Package source for testing
        run: git archive --format=zip --output=AddKo-test-source.zip HEAD

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: AddKo-test-source
          path: AddKo-test-source.zip
          if-no-files-found: error
          retention-days: 7
