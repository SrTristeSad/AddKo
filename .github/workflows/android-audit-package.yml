name: Build and open AddKo native Android
on:
  push:
    branches: [main, fix/native-startup-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build-and-start:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: .cache/kodi
          key: kodi-21.3-arm64-inputstreams-21.5.25-21.3.8
      - name: Stage pinned official Kodi runtime
        run: python3 tools/android/fetch_kodi_runtime.py
      - name: Dependencies
        run: flutter pub get
      - name: Python regressions
        run: python3 -m unittest discover -s tests -v
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Dart tests
        run: flutter test
      - name: Build release ARM64
        run: flutter build apk --release --target-platform android-arm64 --no-pub
      - name: Audit packaged native runtime
        run: python3 tools/android/verify_addko_apk.py build/app/outputs/flutter-apk/app-release.apk --abi arm64-v8a --strict-abi
      - uses: actions/upload-artifact@v4
        with:
          name: AddKo-25-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
          retention-days: 7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open APK on Android with ARM translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/android/test_startup.py build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AddKo-25-startup-diagnostics
          path: dist/startup
          if-no-files-found: ignore
          retention-days: 7
