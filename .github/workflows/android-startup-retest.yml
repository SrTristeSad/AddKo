name: Retest built APK startup
on:
  push:
    branches: [fix/native-startup-ci]
    paths:
      - tools/android/test_startup.py
      - .github/workflows/android-startup-retest.yml
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AddKo-26-arm64-apk
          run-id: 38004116460
          github-token: ${{ github.token }}
          path: build/app/outputs/flutter-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open APK on Android with ARM translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/android/test_startup.py build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AddKo-26-startup-diagnostics
          path: dist/startup
          if-no-files-found: ignore
          retention-days: 7
