name: addko
description: AddKo - sandboxed Lua mini-app platform.
publish_to: "none"
version: 0.0.2+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.6
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  pub_semver: ^2.2.0
  video_player: ^2.9.5

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - examples/hello/manifest.json
    - examples/hello/main.lua
