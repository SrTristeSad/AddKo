name: addko
description: AddKo - Flutter host for legacy Kodi addons and a future Python App Plugin runtime.
publish_to: "none"
version: 0.1.3+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  archive: ^3.6.1
  crypto: ^3.0.6
  ffi: ^2.1.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - runtime/python/addko_worker.py
    - runtime/python/shims/
