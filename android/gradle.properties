org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.47/AGP 9 compatibility while this project still applies the Kotlin Gradle plugin.
android.builtInKotlin=false
# Keep legacy AGP DSL compatibility for the embedded Kodi Android sources.
android.newDsl=false
# The bundled Kodi runtime is large; limiting workers reduces peak RAM on local Windows builds.
org.gradle.workers.max=2
